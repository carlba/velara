services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velara
      POSTGRES_PASSWORD: velara
      POSTGRES_DB: velara
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velora

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '3070:3070'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://velara:velara@postgres:5432/velara
    env_file:
      - .env
    networks:
      - velora

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'
    networks:
      - velora

volumes:
  postgres_data:

networks:
  velora:
    name: velara
